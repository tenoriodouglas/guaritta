name: API CI

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api-ci.yml']

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guaritta
          POSTGRES_PASSWORD: guaritta
          POSTGRES_DB: guaritta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guaritta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://guaritta:guaritta@localhost:5432/guaritta_test
